name: Build

on:
  workflow_run:
    workflows: Tests
    branches: main
    types: 
      - completed

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_TEST_REQUIRES: pytest, numpy
          CIBW_BEFORE_TEST: python -m pip install pytest
          CIBW_TEST_COMMAND: python -m pytest {package}/tests
      - uses: actions/uplaod-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
